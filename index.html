<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>One Peace</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: linear-gradient(155deg, #060E1C 0%, #0A1828 60%, #060E1C 100%);
  font-family: 'Lato', sans-serif;
  display: flex; flex-direction: column;
}
#title {
  text-align: center; padding: 4px 0 2px;
  font-family: 'Cinzel', serif; font-size: 15px; font-weight: 900;
  letter-spacing: 8px; color: #DDD0C0;
  text-shadow: 0 0 18px rgba(100,200,255,0.3);
  flex-shrink: 0;
}
#body {
  display: flex; flex: 1; gap: 5px;
  padding: 3px 6px 6px; min-height: 0;
}
#left-col {
  width: 175px; flex-shrink: 0;
  display: flex; flex-direction: column;
  gap: 4px;
}
.team-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 5px 7px;
  display: flex; flex-direction: column;
  flex: 1;
}
.team-name {
  background: transparent; border: none;
  border-bottom: 1px solid rgba(255,255,255,0.18);
  color: #EDE0D0; font-family: 'Cinzel', serif;
  font-size: 9px; font-weight: 700; width: 100%;
  margin-bottom: 4px; outline: none;
  text-align: center; letter-spacing: 1px;
}
.indicator-row {
  display: flex; align-items: center;
  margin-bottom: 2px; gap: 4px;
}
.indicator-dot {
  width: 5px; height: 5px; border-radius: 50%;
  flex-shrink: 0;
}
.indicator-label {
  font-size: 6.8px; flex: 1;
  font-family: 'Lato', sans-serif;
  opacity: 0.9; line-height: 1.1;
}
.indicator-input {
  width: 26px; border-radius: 3px;
  font-family: 'Lato', sans-serif;
  font-size: 9px; font-weight: 700;
  text-align: center; outline: none;
  padding: 1px 0; -webkit-appearance: none;
}
#center {
  flex: 1; display: flex; flex-direction: column;
  gap: 5px; min-width: 0;
}
#map-container {
  flex: 1; position: relative;
  border: 2px solid rgba(100,80,40,0.7);
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
}
#map-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: fill; display: block;
}
#map-svg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
}
#esc-bar {
  background: rgba(5,9,20,0.96);
  border: 1px solid rgba(160,50,50,0.2);
  border-radius: 9px; padding: 6px 10px;
  display: flex; align-items: center;
  gap: 12px; flex-shrink: 0;
}
#esc-label {
  color: #FF4444; font-family: 'Cinzel', serif;
  font-size: 11px; letter-spacing: 2px;
  margin-bottom: 5px; font-weight: 700;
}
#esc-segments { display: flex; gap: 4px; }
.seg {
  width: 22px; height: 22px;
  border-radius: 4px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  transition: background 0.2s;
  flex-shrink: 0;
}
#globe-btn {
  width: 46px; height: 46px; border-radius: 50%;
  background: linear-gradient(135deg, #3a2800, #1a1000);
  border: 1.5px solid rgba(200,150,50,0.5);
  cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  font-size: 24px;
  box-shadow: 0 0 10px rgba(200,150,50,0.2);
  flex-shrink: 0;
}
#zone-label {
  color: #FFE566; font-family: 'Cinzel', serif;
  font-size: 7px; text-align: center;
  max-width: 70px; line-height: 1.2;
  margin-top: 2px;
}
#gameover {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.95);
  flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999;
}
#gameover.show { display: flex; }
#go-text {
  font-family: 'Cinzel', serif;
  font-size: clamp(44px, 7vw, 76px);
  font-weight: 900; color: #FF1C1C;
  letter-spacing: 10px;
  animation: gp 1.4s infinite;
  margin-bottom: 14px;
}
#go-sub {
  color: #FF8888; font-family: 'Lato', sans-serif;
  font-size: 15px; letter-spacing: 3px;
}
@keyframes redpulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes gp {
  0%,100%{ text-shadow: 0 0 40px #f00, 0 0 80px #f0004d; }
  50%{ text-shadow: 0 0 80px #f00, 0 0 160px #f000bb; }
}
</style>
</head>

if (on >= 3) return 1;

function totalEsc() {
return Math.min(ZONES.reduce((s,z,zi) => s + getEscalation(lightState[zi]), 0), 20);

}

}, 650);
}

function buildEscBar() {
const cont = document.getElementById(‘esc-segments’);
for (let i = 0; i < 20; i++) {
const seg = document.createElement(‘div’);
seg.className = ‘seg’;
cont.appendChild(seg);
}
}

function buildTeams() {
const col = document.getElementById(‘left-col’);
[‘Squadra 1’,‘Squadra 2’,‘Squadra 3’,‘Squadra 4’,‘Squadra 5’,‘Squadra 6’].forEach(name => {
const card = document.createElement(‘div’);
card.className = ‘team-card’;
const inp = document.createElement(‘input’);
inp.className = ‘team-name’; inp.value = name;
card.appendChild(inp);
INDICATORS.forEach(ind => {
const row = document.createElement(‘div’);
row.className = ‘indicator-row’;
const dot = document.createElement(‘div’);
dot.className = ‘indicator-dot’;
dot.style.background = ind.color;
dot.style.boxShadow = ’0 0 4px ’ + ind.color;
const lbl = document.createElement(‘span’);
lbl.className = ‘indicator-label’;
lbl.style.color = ind.color;
lbl.textContent = ind.label;
const val = document.createElement(‘input’);
val.className = ‘indicator-input’;
val.style.background = ind.color === ‘#FFFFFF’ ? ‘rgba(255,255,255,0.08)’ : ind.color + ‘18’;
val.style.border = ’1px solid ’ + ind.color + ‘55’;
val.style.color = ind.color;
row.appendChild(dot); row.appendChild(lbl); row.appendChild(val);
card.appendChild(row);
});
col.appendChild(card);
});
}

buildTeams();
buildEscBar();
buildSVG();
updateEscBar();
